name: ci

on:
  push:
    branches: [ main ]
  pull_request:

env:
  LLVM_VERSION: 23

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "${LLVM_VERSION}"
          sudo apt-get install -y "clang-${LLVM_VERSION}" "libclang-rt-${LLVM_VERSION}-dev"

      - name: Toolchain
        run: clang-${LLVM_VERSION} --version

      - name: Build and run the test suite
        working-directory: framework/C
        run: make test CC=clang-${LLVM_VERSION} AR=llvm-ar-${LLVM_VERSION}

      - name: AddressSanitizer + UBSan
        working-directory: framework/C
        run: make asan CC=clang-${LLVM_VERSION}

      - name: Fuzz smoke (libFuzzer)
        working-directory: framework/C
        run: make fuzz-smoke CC=clang-${LLVM_VERSION}

      - name: Research sweep
        working-directory: framework/C
        run: make research CC=clang-${LLVM_VERSION}

      - name: Cross-check C vs Lua (byte parity)
        run: |
          wget -qO /tmp/luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -o /tmp/luau.zip -d /tmp/luau
          /tmp/luau/luau --version || true
          make -C framework/C xcheck CC=clang-${LLVM_VERSION} > /tmp/xcheck_c.txt
          /tmp/luau/luau framework/luau/xcheck.lua > /tmp/xcheck_lua.txt
          diff -u /tmp/xcheck_c.txt /tmp/xcheck_lua.txt
          echo "C<->Lua byte parity OK ($(wc -l < /tmp/xcheck_c.txt) lines)"
