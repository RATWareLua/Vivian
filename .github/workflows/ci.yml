name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Toolchain
        run: clang --version

      - name: Build and run the test suite
        working-directory: framework/C
        run: make test

      - name: AddressSanitizer + UBSan
        working-directory: framework/C
        run: make asan
